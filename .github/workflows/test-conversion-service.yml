name: Test Office PDF Conversion Service
on:
  push:
    paths:
      - 'conversion-service/**'
      - '.github/workflows/test-conversion-service.yml'
  pull_request:
    paths:
      - 'conversion-service/**'
      - '.github/workflows/test-conversion-service.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: conversion-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Run API contract tests
        run: python -m pytest -q test_main.py
      - name: Check source compilation
        run: python -m compileall -q main.py
