name: Test Office PDF Conversion Service
on:
  push:
    paths:
      - 'conversion-service/**'
      - '.github/workflows/test-conversion-service.yml'
  pull_request:
    paths:
      - 'conversion-service/**'
      - '.github/workflows/test-conversion-service.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: conversion-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Run API contract tests
        run: python -m pytest -q test_main.py
      - name: Check source compilation
        run: python -m compileall -q main.py
      - name: Install LibreOffice for real conversion smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc libreoffice-writer fonts-liberation
      - name: Run real Excel and Word conversion smoke tests
        run: python -m pytest -q test_real_conversion.py
      - name: Test no-billing offline desktop conversion\n        run: python -m pytest -q test_local_convert.py\n      - name: Build production conversion container
        run: docker build -t docutils-conversion-service:test .
      - name: Check container health endpoint
        run: |
          docker run -d --rm --name docutils-conversion-smoke -p 127.0.0.1:18080:8080 -e CONVERSION_API_KEY=ci-test-only-key docutils-conversion-service:test
          trap 'docker stop docutils-conversion-smoke || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health; then exit 0; fi
            sleep 2
          done
          docker logs docutils-conversion-smoke
          exit 1


