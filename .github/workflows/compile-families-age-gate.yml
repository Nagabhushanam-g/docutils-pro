name: Compile Families Age Gate
on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/com/docutility/pro/MainActivity.kt'
      - 'app/src/main/java/com/docutility/pro/monetization/**'
      - 'app/build.gradle.kts'
      - 'tests/test_families_startup_guards.py'
      - 'docs/FAMILIES_RELEASE_STATUS.txt'
      - 'scripts/play-release-preflight.sh'
      - '.github/workflows/compile-families-age-gate.yml'
  pull_request:
    paths:
      - 'app/src/main/java/com/docutility/pro/**'
      - 'app/build.gradle.kts'
      - 'tests/test_families_startup_guards.py'
      - 'docs/FAMILIES_RELEASE_STATUS.txt'
      - 'scripts/play-release-preflight.sh'
      - '.github/workflows/compile-families-age-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kotlin-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test Families startup safety boundaries
        run: python3 -m unittest discover -s tests -p 'test_families_startup_guards.py' -v
      - name: Compile Android Kotlin without signing an APK
        run: gradle :app:compileDebugKotlin --stacktrace --console=plain
