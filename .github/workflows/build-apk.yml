name: Build Debug APK
run-name: DocUtils APK • ${{ github.ref_name }} • ${{ github.sha }}
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Restore permanent Android debug signing key
        env:
          DOCUTILS_DEBUG_KEYSTORE_BASE64: ${{ secrets.DOCUTILS_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DOCUTILS_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Missing DOCUTILS_DEBUG_KEYSTORE_BASE64 secret. Configure the permanent signing key before building another APK."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$DOCUTILS_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
      - name: Compile debug APK and capture log
        env:
          DOCUTILS_ADMOB_APP_ID: ${{ vars.DOCUTILS_ADMOB_APP_ID }}
          DOCUTILS_ADMOB_BANNER_ID: ${{ vars.DOCUTILS_ADMOB_BANNER_ID }}
          DOCUTILS_ADMOB_INTERSTITIAL_ID: ${{ vars.DOCUTILS_ADMOB_INTERSTITIAL_ID }}
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee build-output.log
      - name: Publish build diagnostics in run summary
        if: always()
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "### APK compilation completed" >> "$GITHUB_STEP_SUMMARY"
            ls -lh app/build/outputs/apk/debug/app-debug.apk >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### APK missing — inspect failed steps above" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f build-output.log ]; then
            echo '#### Last 60 lines of Gradle output' >> "$GITHUB_STEP_SUMMARY"
            echo '\`\`\`text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 60 build-output.log >> "$GITHUB_STEP_SUMMARY"
            echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Report APK signing certificate
        if: success()
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK" | grep -E 'Signer #1 certificate (DN|SHA-256 digest)'
          echo "Compare the SHA-256 certificate fingerprint with the currently installed APK before attempting an update."
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DocUtils-Debug-APK
          retention-days: 7
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Keep latest 10 successful APK artifacts
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner, repo, per_page: 100
            });
            const apkArtifacts = artifacts.filter(a => a.name === 'DocUtils-Debug-APK' && !a.expired);
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'build-apk.yml', status: 'success', per_page: 100
            });
            const successfulRunIds = new Set(runs.map(r => r.id));
            const successful = apkArtifacts.filter(a => successfulRunIds.has(a.workflow_run?.id));
            successful.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const retained = new Set(successful.slice(0, 9).map(a => a.id));
            let deleted = 0;
            for (const artifact of artifacts) {
              if (artifact.name !== 'DocUtils-Debug-APK' && artifact.name !== 'DocUtils-Build-Log') continue;
              if (retained.has(artifact.id)) continue;
              if (artifact.workflow_run?.id === context.runId) continue;
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
              deleted++;
            }
            core.info('Kept ' + retained.size + ' successful APK artifacts; deleted ' + deleted + ' old artifacts.');
