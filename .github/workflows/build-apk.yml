name: Build Debug APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Compile debug APK and capture log
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee build-output.log
      - name: Free artifact storage after successful compilation
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
          const { owner, repo } = context.repo;
          const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
            owner, repo, per_page: 100
          });
          const apkArtifacts = artifacts.filter(a => a.name === 'DocUtils-Debug-APK' && !a.expired);
          const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
            owner, repo, workflow_id: 'build-apk.yml', status: 'success', per_page: 100
          });
          const successfulRunIds = new Set(runs.map(r => r.id));
          const successful = apkArtifacts.filter(a => successfulRunIds.has(a.workflow_run?.id));
          successful.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
          const retained = new Set(successful.slice(0, 9).map(a => a.id));
          let deleted = 0;
          for (const artifact of artifacts) {
            if (artifact.name !== 'DocUtils-Debug-APK' && artifact.name !== 'DocUtils-Build-Log') continue;
            if (retained.has(artifact.id)) continue;
            if (artifact.workflow_run?.id === context.runId) continue;
            await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
            deleted++;
          }
          core.info('Kept ' + retained.size + ' successful APK artifacts; deleted ' + deleted + ' old artifacts.');
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DocUtils-Debug-APK
          retention-days: 7
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Keep latest 10 successful APK artifacts
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
          const { owner, repo } = context.repo;
          const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
            owner, repo, per_page: 100
          });
          const apkArtifacts = artifacts.filter(a => a.name === 'DocUtils-Debug-APK' && !a.expired);
          const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
            owner, repo, workflow_id: 'build-apk.yml', status: 'success', per_page: 100
          });
          const successfulRunIds = new Set(runs.map(r => r.id));
          const successful = apkArtifacts.filter(a => successfulRunIds.has(a.workflow_run?.id));
          successful.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
          const retained = new Set(successful.slice(0, 9).map(a => a.id));
          let deleted = 0;
          for (const artifact of artifacts) {
            if (artifact.name !== 'DocUtils-Debug-APK' && artifact.name !== 'DocUtils-Build-Log') continue;
            if (retained.has(artifact.id)) continue;
            if (artifact.workflow_run?.id === context.runId) continue;
            await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
            deleted++;
          }
          core.info('Kept ' + retained.size + ' successful APK artifacts; deleted ' + deleted + ' old artifacts.');
