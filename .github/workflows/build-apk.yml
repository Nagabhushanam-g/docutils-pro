name: Build Debug APK
run-name: DocUtils APK • ${{ github.ref_name }} • ${{ github.sha }}
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Restore permanent Android debug signing key
        env:
          DOCUTILS_DEBUG_KEYSTORE_BASE64: ${{ secrets.DOCUTILS_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DOCUTILS_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Missing DOCUTILS_DEBUG_KEYSTORE_BASE64 secret. Configure the permanent signing key before building another APK."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$DOCUTILS_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          # This must not change between releases. GitHub Actions runs 158–165
          # had different signer fingerprints, making in-place APK updates fail.
          EXPECTED_SIGNER_SHA256="b329e139277a3994d49b25098b0d983a5dd9bc82f1b08b1f91d087ccc0a3cdfc"
          ACTUAL_SIGNER_SHA256="$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)"
          echo "Debug keystore certificate SHA-256: $ACTUAL_SIGNER_SHA256"
          echo "### Debug signing identity" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: \`$ACTUAL_SIGNER_SHA256\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$ACTUAL_SIGNER_SHA256" != "$EXPECTED_SIGNER_SHA256" ]; then
            echo "::error::Signing certificate changed! Refusing to publish an incompatible APK. Restore the same permanent DOCUTILS_DEBUG_KEYSTORE_BASE64 keystore used for build #165. Build #160 had a different signer already and cannot be updated by #165 without reinstalling."
            exit 1
          fi
      - name: Compile debug APK and capture log
        env:
          DOCUTILS_ADMOB_APP_ID: ${{ vars.DOCUTILS_ADMOB_APP_ID }}
          DOCUTILS_ADMOB_BANNER_ID: ${{ vars.DOCUTILS_ADMOB_BANNER_ID }}
          DOCUTILS_ADMOB_INTERSTITIAL_ID: ${{ vars.DOCUTILS_ADMOB_INTERSTITIAL_ID }}
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee build-output.log
      - name: Publish build diagnostics in run summary
        if: always()
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "### APK compilation completed" >> "$GITHUB_STEP_SUMMARY"
            ls -lh app/build/outputs/apk/debug/app-debug.apk >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### APK missing — inspect failed steps above" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f build-output.log ]; then
            echo '#### Last 60 lines of Gradle output' >> "$GITHUB_STEP_SUMMARY"
            echo '\`\`\`text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 60 build-output.log >> "$GITHUB_STEP_SUMMARY"
            echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Report APK signing certificate
        if: success()
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK" | grep -E 'Signer #1 certificate (DN|SHA-256 digest)'
          echo "### Install-over-existing compatibility details" >> "$GITHUB_STEP_SUMMARY"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "^package:" | tee -a "$GITHUB_STEP_SUMMARY"
          "$APKSIGNER" verify --print-certs "$APK" | grep 'Signer #1 certificate SHA-256 digest' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Android updates require the same applicationId, signing certificate, and a higher versionCode." >> "$GITHUB_STEP_SUMMARY"
          echo "If the installed app has a different certificate, do not uninstall it before backing up saved files." >> "$GITHUB_STEP_SUMMARY"
      - name: Give APK an unambiguous build-number filename
        if: success()
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/DocUtils-Pro-Build-${GITHUB_RUN_NUMBER}.apk"
          sha256sum "dist/DocUtils-Pro-Build-${GITHUB_RUN_NUMBER}.apk" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DocUtils-Debug-APK
          retention-days: 7
          path: dist/DocUtils-Pro-Build-*.apk
          if-no-files-found: error

      - name: Verify downloadable APK artifact exists
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            let artifact;
            for (let attempt = 0; attempt < 5; attempt++) {
              const response = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: context.runId, per_page: 100
              });
              artifact = response.data.artifacts.find(a =>
                a.name === 'DocUtils-Debug-APK' && !a.expired && a.size_in_bytes > 0
              );
              if (artifact) break;
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
            if (!artifact) {
              core.setFailed('APK artifact was not found after upload. Check Actions artifact storage quota and upload step logs.');
            } else {
              core.summary.addRaw('### APK ready for download\\n')
                .addRaw('Artifact: DocUtils-Debug-APK (' + artifact.size_in_bytes + ' bytes)\\n')
                .addLink('Open this run to download', context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId);
              await core.summary.write();
            }

      - name: Keep latest 10 successful APK artifacts
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner, repo, per_page: 100
            });
            const apkArtifacts = artifacts.filter(a => a.name === 'DocUtils-Debug-APK' && !a.expired);
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'build-apk.yml', status: 'success', per_page: 100
            });
            const successfulRunIds = new Set(runs.map(r => r.id));
            const successful = apkArtifacts.filter(a => successfulRunIds.has(a.workflow_run?.id));
            successful.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const retained = new Set(successful.slice(0, 10).map(a => a.id));
            let deleted = 0;
            for (const artifact of artifacts) {
              if (artifact.name !== 'DocUtils-Debug-APK' && artifact.name !== 'DocUtils-Build-Log') continue;
              if (retained.has(artifact.id)) continue;
              if (artifact.workflow_run?.id === context.runId) continue;
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
              deleted++;
            }
            core.info('Kept ' + retained.size + ' successful APK artifacts; deleted ' + deleted + ' old artifacts.');
