name: Office PDF Layout Regression Tests
on:
  push:
    branches: [main, master]
    paths:
      - 'conversion-service/**'
      - '.github/workflows/office-pdf-tests.yml'
  pull_request:
    paths:
      - 'conversion-service/**'
      - '.github/workflows/office-pdf-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: conversion-service/requirements-test.txt
      - name: Install LibreOffice and compatible fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc libreoffice-writer fonts-liberation fonts-dejavu-core
      - name: Install test dependencies
        run: python -m pip install -r conversion-service/requirements-test.txt
      - name: Test Office conversion and source print pagination
        working-directory: conversion-service
        run: python -m pytest -q test_main.py test_local_convert.py test_real_conversion.py test_print_layout.py
